# Nginx Reverse Proxy for Monero Restricted RPC (/etc/nginx/sites-available/monerod-rpc.conf)
# Terminates HTTPS TLS and sets CORS headers so browser wallets (e.g. MonkStash)
# and desktop/mobile wallets can connect over port 443.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node.example.com;

    ssl_certificate     /etc/letsencrypt/live/node.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.example.com/privkey.pem;

    # Block administrative daemon endpoints at the proxy layer
    location ~ ^/(stop_daemon|start_mining|stop_mining|mining_status|save_bc|set_log) {
        return 403;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        proxy_pass http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization' always;
    }
}
