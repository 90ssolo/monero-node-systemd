# Hardened Pruned Monero Node Configuration (/etc/monero/monerod.conf)
# Requires ~95 GB of SSD storage instead of ~240+ GB while validating every block.

data-dir=/var/lib/monero
log-file=/var/log/monero/monerod.log
log-level=0
max-log-file-size=104857600
max-log-files=5

# Storage & Pruning
prune-blockchain=1
sync-pruned-blocks=1
db-sync-mode=safe

# P2P Consensus Network
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
out-peers=32
in-peers=64
limit-rate-up=16384
limit-rate-down=32768
no-igd=1
enable-dns-blocklist=1

# Unrestricted RPC (bound strictly to localhost)
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081

# Restricted Wallet RPC (safe for wallets & reverse proxy)
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=18089
public-node=1
confirm-external-bind=1
rpc-access-control-origins=*
disable-rpc-ban=1
