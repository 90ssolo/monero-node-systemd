<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="100%" height="auto" role="img" aria-label="Systemd Sandboxing and Verification Pipeline">
  <rect width="1200" height="390" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="36" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">Bare-Metal Verification &amp; Systemd Sandboxing Pipeline</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">How the installer verifies official getmonero.org releases and isolates the daemon on Linux</text>

  <g transform="translate(36, 96)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="356" height="254" rx="10" fill="#161b22" stroke="#ff6600" stroke-width="1.5"/>
    <rect x="0" y="0" width="356" height="38" rx="10" fill="#24160e"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ff6600">1. Cryptographic Release Verification</text>
    <text x="18" y="62" font-size="12" fill="#f0f6fc">• Imports binaryfate GPG signing key</text>
    <text x="18" y="84" font-size="11" fill="#8b949e">  81AC 591F E9C4 B65C 5806 AFC3 F0AF 4D46 2A0B DF92</text>
    <text x="18" y="114" font-size="12" fill="#f0f6fc">• Verifies getmonero.org hashes.txt</text>
    <text x="18" y="136" font-size="11" fill="#8b949e">  gpg --verify hashes.txt</text>
    <text x="18" y="166" font-size="12" fill="#f0f6fc">• Checks tarball SHA-256 digest</text>
    <text x="18" y="188" font-size="11" fill="#8b949e">  sha256sum -c --ignore-missing</text>
    <rect x="18" y="206" width="320" height="32" rx="6" fill="#0d1117" stroke="#238636"/>
    <text x="30" y="226" font-size="11.5" fill="#3fb950">Aborts immediately on hash mismatch</text>

    <!-- Stage 2 -->
    <rect x="386" y="0" width="356" height="254" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="386" y="0" width="356" height="38" rx="10" fill="#101f33"/>
    <text x="404" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">2. Systemd Process Sandboxing</text>
    <text x="404" y="62" font-size="12" fill="#f0f6fc">• Unprivileged monero system user</text>
    <text x="404" y="84" font-size="11" fill="#8b949e">  /usr/sbin/nologin shell, no home login</text>
    <text x="404" y="114" font-size="12" fill="#f0f6fc">• Read-only root filesystem</text>
    <text x="404" y="136" font-size="11" fill="#8b949e">  ProtectSystem=strict, ProtectHome=true</text>
    <text x="404" y="166" font-size="12" fill="#f0f6fc">• Kernel &amp; privilege restrictions</text>
    <text x="404" y="188" font-size="11" fill="#8b949e">  NoNewPrivileges=true, PrivateDevices=true</text>
    <rect x="404" y="206" width="320" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="416" y="226" font-size="11.5" fill="#58a6ff">TimeoutStopSec=120s for safe LMDB flush</text>

    <!-- Stage 3 -->
    <rect x="772" y="0" width="356" height="254" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="772" y="0" width="356" height="38" rx="10" fill="#102418"/>
    <text x="790" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3fb950">3. Wallet &amp; Reverse Proxy Access</text>
    <text x="790" y="62" font-size="12" fill="#f0f6fc">• Unrestricted RPC (127.0.0.1:18081)</text>
    <text x="790" y="84" font-size="11" fill="#8b949e">  Never exposed outside localhost</text>
    <text x="790" y="114" font-size="12" fill="#f0f6fc">• Restricted RPC (:18089)</text>
    <text x="790" y="136" font-size="11" fill="#8b949e">  Safe subset for desktop &amp; mobile wallets</text>
    <text x="790" y="166" font-size="12" fill="#f0f6fc">• Nginx / Caddy HTTPS + CORS (:443)</text>
    <text x="790" y="188" font-size="11" fill="#8b949e">  Lets browser wallets (MonkStash) sync</text>
    <rect x="790" y="206" width="320" height="32" rx="6" fill="#0d1117" stroke="#238636"/>
    <text x="802" y="226" font-size="11.5" fill="#3fb950">UFW firewall rules included</text>
  </g>
</svg>
